<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace Demo</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><a class="brand" href="/">mercado livre <small>LOJA DEMONSTRATIVA</small></a><form id="searchForm"><input id="searchInput" placeholder="Buscar produtos..."><button>Buscar</button></form><span>Olá! Bem-vindo</span></header>
<nav id="categories"></nav><section class="hero"><div><h1>Ofertas que combinam com você</h1><p>Tecnologia, acessórios e muito mais.</p></div><b>📦💻</b></section>
<main><h2 id="heading">Ofertas em destaque</h2><section id="products" class="products"></section></main>
<button id="cartButton" class="cartButton">🛒 Carrinho (<span id="cartCount">0</span>)</button>
<aside id="cartPanel"><div class="cartHead"><h2>Seu carrinho</h2><button id="closeCart">Fechar</button></div><div id="cartItems"></div><h3>Total: <span id="cartTotal">R$ 0,00</span></h3>
<form id="checkoutForm"><h3>Pedido demonstrativo</h3><input id="customerName" placeholder="Nome completo" required><input id="customerEmail" type="email" placeholder="E-mail" required><button>Registrar pedido de teste</button></form><p class="note">Sem cobrança ou pagamento real.</p></aside><div id="toast"></div><script src="/app.js"></script></body></html>
